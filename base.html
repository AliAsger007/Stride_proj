<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>{% block t %}Stride{% endblock %}</title><link rel=stylesheet href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav><div class=wrap><a class=logo href="/">stride<b>.</b></a><button id=burger aria-label=Menu onclick="document.getElementById('links').classList.toggle('open')">&#9776;</button>
<div class=links id=links><a href="/">Home</a>{% if user %}<a href="/account">My account</a>{% if user.role=='admin' %}<a href="/admin">Admin</a>{% endif %}<a href="/logout">Log out</a>{% else %}<a href="/login">Log in</a><a class=btn href="/register">Sign up</a>{% endif %}</div></div></nav>
<main class="wrap pg">{% for m in get_flashed_messages() %}<p class="note">{{m}}</p>{% endfor %}{% block body %}{% endblock %}</main></body></html>
