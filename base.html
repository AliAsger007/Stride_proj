<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>{% block t %}Stride{% endblock %}</title><link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}"><link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='stride-icon.png') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='stride-icon.png') }}"><link rel=stylesheet href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav><div class=wrap><a class=logo href="/"><img class=lg src="{{ url_for('static', filename='stride-logo.png') }}" alt="Stride" width=198 height=52></a><button id=burger aria-label=Menu onclick="document.getElementById('links').classList.toggle('open')">&#9776;</button>
<div class=links id=links><a href="/">Home</a>{% if user %}<a href="/account">My account</a>{% if user.role=='admin' %}<a href="/admin">Admin</a>{% endif %}<details class=profile-menu><summary><span class=avatar>{{user.name[:1]|upper}}</span><span class=profile-name>{{user.name}}</span></summary><div class=profile-pop><a href="/account">My Account</a><a href="/account#dashboard">Dashboard</a><a href="/membership">Membership</a><a href="/account#history">Booking history</a><a href="/logout">Logout</a></div></details>{% else %}<a href="/login">Log in</a><a class=btn href="/register">Sign up</a>{% endif %}</div></div></nav>
<main class="wrap pg">{% for m in get_flashed_messages() %}<p class="note">{{m}}</p>{% endfor %}{% block body %}{% endblock %}</main></body></html>
